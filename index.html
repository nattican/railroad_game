<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#def" />

		<link rel="manifest" href="manifest.webmanifest" />
		<link rel="stylesheet" href="client/client.css" />
		<link rel="icon" href="img/icon.svg" />
		<link rel="apple-touch-icon" href="img/icon-192.png" />

		<title>Railroad Ink</title>
		<style>
			body { min-width: 0; }
			.puzzle-link { display: flex; align-items: center; justify-content: center; height: 100%; min-height: 44px; padding: 8px; border: 1px solid #215d83; background: #215d83; color: white; text-decoration: none; font-size: 14px; }
			main { width: 100%; padding: 0 12px; }
			#intro, #outro, #game { width: 100%; max-width: 574px; min-width: 0; }
			#intro ul, #outro ul, #game #multi-setup ul { flex-wrap: wrap; gap: 8px; }
			#intro ul li, #outro ul li, #game #multi-setup ul li { flex: 1 1 120px; margin: 0; }
			#game #multi-setup { min-width: 0; max-width: 100%; }
			#game #multi-setup input { max-width: 100%; min-width: 0; }
			#game { max-width: min(100%, var(--board-width)); padding: 12px 0 4px; }
			#game .pool {
				display: grid;
				grid-template-columns: repeat(6, minmax(0, 1fr));
				gap: 6px;
				padding: 0;
				border: 0;
			}
			#game .pool + .pool { margin-top: 14px; }
			#game .pool h2 {
				grid-column: 1 / -1;
				width: auto;
				text-align: left;
				font-size: 13px;
				font-weight: 600;
				line-height: 20px;
				color: #3f5b70;
			}
			#game .pool .dice { min-width: 0; aspect-ratio: 1; border-color: #40576b; }
			#game .pool .dice .tile { width: 100%; height: 100%; }
			#game .pool .dice + .dice { margin-left: 0; }
			#game .pool button { grid-column: 1 / -1; width: auto; height: auto; min-height: 44px; margin: 0; }
			.board-frame { width: 100%; max-width: var(--board-width); overflow: hidden; }
			.board-frame > .board { width: var(--board-width); transform-origin: top left; }
			#round-actions { display: none; width: 100%; max-width: var(--board-width); padding: 8px 0 max(16px, env(safe-area-inset-bottom)); }
			body[data-stage="game"] #round-actions:not(:empty) { display: block; }
			#round-actions button {
				width: 100%;
				min-height: 48px;
				border: 1px solid #215d83;
				border-radius: 8px;
				background: #215d83;
				color: white;
				font: 600 15px/1.4 sans-serif;
				touch-action: manipulation;
			}
			#round-actions button:disabled { opacity: 1; background: #c9ddec; border-color: #91acbf; color: #4c6375; cursor: default; }
			#round-actions button:focus-visible { outline: 3px solid #163f5a; outline-offset: 3px; }
			@media (hover: hover) { #round-actions button:not(:disabled):hover { background: #174b6d; } }
			@media (max-width: 360px) {
				main { padding-inline: 8px; }
				#game .pool { gap: 4px; }
			}
		</style>
	</head>

	<body>
		<h1>Railroad Ink</h1>
		<main>
			<section id="intro">
				<p>Tap to place or rotate any tile. Double-tap a tile placed this round to remove it.</p>
				<ul>
					<li><button name="start-normal"><strong>Play normal game</strong></button></li>
					<li><button name="start-lake">Play with lakes</button></li>
					<li><button name="start-river">Play with rivers</button></li>
					<li><button name="start-forest">Play with forests</button></li>
					<li><button name="start-multi">Multiplayer</button></li>
					<li><a class="puzzle-link" href="puzzle.html">Речной пазл</a></li>
				</ul>
			</section>

			<section id="game"></section>

			<section id="outro">
				<h2>Game over</h2>
				<ul>
					<li><button name="again"><strong>Play again</strong></button></li>
					<li><button name="download">Download an image of the game</button></li>
				</ul>
			</section>

			<section id="score"></section>
		</main>
		<template>
			<div id="multi-setup">
				<table>
					<tr>
						<td>Your name: </td><td><input name="player-name" value="player" /></td>
					</tr>
					<tr>
						<td>Game name: </td><td><input name="game-name" value="game" /></td>
					</tr>
				</table>
				<ul>
					<li><button name="create-normal">Create normal game</button></li>
					<li><button name="join">Join game</button></li>
					<li><button name="continue">Continue game</button></li>
				</ul>

				<ul>
					<li><button name="create-lake">Create game with lakes</button></li>
					<li><button name="create-river">Create game with rivers</button></li>
					<li><button name="create-forest">Create game with forests</button></li>
				</ul>
			</div>
			<div id="multi-lobby">
				<h2>Players</h2>
				<ul></ul>
				<button name="start"></button>
			</div>
		</template>

		<script>
			// The layout moves the original round button, retaining the game's listeners
			// and disabled state. No placement, rotation or scoring rules change here.
			const gameMain = document.querySelector("main");
			const roundActions = document.createElement("div");
			roundActions.id = "round-actions";
			let actionPool = null;
			const syncControls = () => {
				const bonusHeading = gameMain.querySelector(".pool.bonus h2");
				if (bonusHeading && bonusHeading.textContent !== "Специальные") {
					bonusHeading.textContent = "Специальные";
					bonusHeading.lang = "ru";
				}
				const pool = gameMain.querySelector("#game .pool:not(.bonus)");
				if (pool === actionPool) { return; }
				actionPool = pool;
				roundActions.replaceChildren();
				if (!pool) { return; }
				const button = pool.querySelector("button");
				const heading = pool.querySelector("h2");
				const number = heading.textContent.match(/Round #(\d+)/);
				if (number) {
					// River/lake pools contain six dice and last six rounds;
					// normal/forest pools contain four and last seven (rules.ts).
					const rounds = pool.querySelectorAll(".dice").length === 6 ? 6 : 7;
					heading.textContent = `Раунд ${number[1]} / ${rounds}`;
					heading.lang = "ru";
				}
				if (button) {
					button.textContent = "Завершить раунд";
					button.lang = "ru";
					roundActions.append(button);
				}
			};
			// Keep the board's drawing coordinates stable while fitting any screen width.
			const fitFrame = frame => {
				const board = frame.querySelector(".board");
				if (!board) { return; }
				const scale = Math.min(1, frame.clientWidth / board.offsetWidth);
				board.style.transform = `scale(${scale})`;
				frame.style.height = `${board.offsetHeight * scale}px`;
			};
			const fitBoards = () => {
				gameMain.querySelectorAll(":scope > .board").forEach(board => {
					const frame = document.createElement("div");
					frame.className = "board-frame";
					board.before(frame);
					frame.append(board);
					new ResizeObserver(() => fitFrame(frame)).observe(frame);
				});
				gameMain.querySelectorAll(".board-frame").forEach(fitFrame);
				const frame = gameMain.querySelector(".board-frame");
				if (frame && frame.nextElementSibling !== roundActions) { frame.after(roundActions); }
				syncControls();
			};
			new MutationObserver(fitBoards).observe(gameMain, { childList: true, subtree: true });
		</script>
		<script type="module" src="client/client.js"></script>
		<script>navigator.serviceWorker.register("sw.js");</script>
	</body>
</html>
